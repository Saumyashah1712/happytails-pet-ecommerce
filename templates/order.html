{% extends 'master.html' %}
{% block body %}


<section id="cart_items">
       <div class="container">
          <div class="breadcrumbs">
             <ol class="breadcrumb">
               <li><a href="#">Home</a></li>
               <li class="active">Your Order</li>
             </ol>
          </div>
          <div class="table-responsive cart_info">
             <table class="table table-condensed">
                <thead>
                   <tr class="cart_menu">
                      <td class="image">Item</td>
                      <td class="description"></td>
                      <td class="price">Price</td>
                      <td class="quantity">Quantity</td>
                      <td class="total">Total</td>
                      <td></td>
                   </tr>
                </thead>
                <tbody>
                {% for order in orders %}

<tr>
    <td class="cart_product">
        <a href=""><img src="{{ order.product.image.url }}" alt="" height="200" width="200"></a>
    </td>
    <td class="cart_description">
        <h4><a href="">{{ order.product.name }}</a></h4>
        <p>Web ID: {{ order.product.id }}</p>
    </td>
    <td class="cart_price">
        <p>₹ {{ order.price }}</p>
    </td>
    <td class="cart_quantity">
        <div class="cart_quantity_button">
            <input class="cart_quantity_input" type="text" readonly name="quantity" value="{{ order.quantity }}" autocomplete="off" size="2">
        </div>
    </td>
    <td class="cart_total">
        <p class="cart_total_price">₹ {{ order.total_price }}</p>
    </td>
</tr>
{% endfor %}

                </tbody>

             </table>
          </div>
          </div>
    </section> <!--/#cart_items-->

{% endblock %}
