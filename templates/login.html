{% extends 'master.html' %}

{% block body %}

<!DOCTYPE html>
<html lang="en">

<head>
    {% load static %}
    <title>HappyTails - Login</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <header>
    <!-- Header content here -->
  </header>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <h2 class="text-center mb-4">Login</h2>
        <form action="/login/" method="POST" class="p-4 border rounded shadow-sm">
          {% csrf_token %}

          {% if error %}
        <div class="alert alert-danger" role="alert">
            {{ error }}
        </div>
          {% endif %}

          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
          </div>
          <div class="d-flex justify-content-between align-items-center">
            <button type="submit" class="btn btn-primary">Login</button>
            <a href="{% url 'password_reset' %}" class="text-decoration-none">Forgot password?</a>
          </div>
          <div class="text-center mt-3">
            <p>Don't have an account? <a href="/signup/" class="text-decoration-none">Sign up</a></p>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer>
    <!-- Footer content here -->
  </footer>
</body>

</html>


{% endblock %}
